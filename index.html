<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تجربه‌ها</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0"></script>
<script>window.Appwrite||document.write('<script src="https://unpkg.com/appwrite@16.0.0"><\/script>')</script>
<script>window.Appwrite||document.write('<script src="https://gcore.jsdelivr.net/npm/appwrite@16.0.0"><\/script>')</script>
<style>
  :root { --bg:#f6f3ee; --card:#ffffff; --ink:#1d2a2a; --muted:#6b7777; --accent:#1f6f6b; --accent-ink:#ffffff; --line:#e3ded5; --danger:#b3412f; --navh:calc(62px + env(safe-area-inset-bottom,0px)); }
  :root[data-theme="dark"] { --bg:#14181a; --card:#1d2326; --ink:#e8eeee; --muted:#9aa8a8; --accent:#3fb6ad; --accent-ink:#0b1414; --line:#2c3538; --danger:#e07a67; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Tahoma,"Segoe UI",system-ui,sans-serif; line-height:1.7; padding-bottom:var(--navh); }
  body.reelmode { padding-bottom:0; overflow:hidden; }
  body.reelmode header { display:none; }
  body.reelmode main { padding:0; max-width:none; }
  header { padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; margin:0; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  a { color:var(--accent); }
  input, textarea, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; margin-bottom:10px; background:var(--card); color:var(--ink); }
  input[type=checkbox] { width:auto; margin:0 0 0 8px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); padding:9px 16px; border-radius:10px; }
  button.ghost { background:transparent; color:var(--accent); }
  button.danger { background:transparent; color:var(--danger); border-color:var(--danger); padding:4px 10px; font-size:13px; }
  button.small { padding:4px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, select:focus-visible { outline:3px solid #f0b429; outline-offset:2px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); font-size:14px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .avatar { width:36px; height:36px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:inline-flex; align-items:center; justify-content:center; font-weight:bold; flex:none; object-fit:cover; }
  .avatar.big { width:72px; height:72px; font-size:30px; }
  .tick { color:#2b8be0; margin-inline-start:4px; }
  .chip { display:inline-flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 12px 4px 6px; margin:0 0 8px 8px; text-decoration:none; color:inherit; }
  .profile-head { display:flex; gap:16px; align-items:center; }
  .profile-head h2 { margin:0; }
  .links a { display:inline-block; margin:0 0 6px 8px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; }
  .tab { flex:1; white-space:nowrap; background:transparent; color:var(--muted); border:1px solid var(--line); padding:6px 10px; }
  .tab.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  nav { position:fixed; bottom:0; right:0; left:0; background:var(--card); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px)); z-index:6; }
  nav a { flex:1; text-align:center; text-decoration:none; color:var(--muted); font-size:13px; padding:4px 0; }
  nav a.on { color:var(--accent); font-weight:bold; }
  nav a .ic { display:block; font-size:20px; line-height:1.2; }
  #msg { position:fixed; bottom:calc(var(--navh) + 8px); right:16px; left:16px; max-width:520px; margin:0 auto; background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:10px; display:none; z-index:50; }
  /* ---- فید تمام‌صفحه مثل شورتس ---- */
  .reelwrap { position:relative; height:calc(100dvh - var(--navh)); background:#000; }
  .reel { height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; overscroll-behavior:contain; }
  .rtop { position:absolute; top:0; right:0; left:0; z-index:4; display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:linear-gradient(rgba(0,0,0,.6),transparent); color:#fff; }
  .rtop .tabs { margin:0; overflow:visible; }
  .rtop .tab { flex:none; color:#ddd; border:none; background:transparent; font-size:15px; padding:4px 10px; }
  .rtop .tab.on { color:#fff; background:transparent; border-bottom:2px solid #fff; border-radius:0; }
  .rtop button.ic { background:transparent; border:none; color:#fff; font-size:20px; padding:4px 8px; position:relative; }
  .badge { position:absolute; top:-2px; right:-2px; background:#e03131; color:#fff; border-radius:999px; font-size:11px; padding:0 5px; }
  .ri { height:100%; scroll-snap-align:start; scroll-snap-stop:always; position:relative; color:#fff; background:#000; overflow:hidden; }
  .ri video, .ri img.full { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .ri .txt { position:absolute; inset:0; overflow-y:auto; padding:64px 20px 120px 72px; font-size:22px; line-height:1.9; text-align:center; background:linear-gradient(160deg,#1f6f6b,#162a3a); white-space:pre-wrap; word-break:break-word; display:flex; flex-direction:column; }
  .ri .txt .tb { margin:auto 0; }
  .ri .txt.long { text-align:start; font-size:17px; }
  .ri .txt a { color:#ffd166; }
  .ri .shade { position:absolute; right:0; left:0; bottom:0; height:50%; background:linear-gradient(transparent,rgba(0,0,0,.7)); pointer-events:none; }
  .ri .info { position:absolute; right:12px; left:76px; bottom:14px; text-shadow:0 1px 3px #000; }
  .ri .info a { color:#fff; font-weight:bold; text-decoration:none; }
  .ri .info .t { margin:6px 0; white-space:pre-wrap; word-break:break-word; max-height:7em; overflow:auto; }
  .ri .info .t a { font-weight:normal; text-decoration:underline; }
  .ri .side { position:absolute; left:8px; bottom:14px; display:flex; flex-direction:column; gap:10px; align-items:center; z-index:2; }
  .sbtn { background:rgba(0,0,0,.45); border:none; color:#fff; border-radius:26px; min-width:50px; padding:6px 4px; font-size:20px; line-height:1.2; display:flex; flex-direction:column; align-items:center; }
  .sbtn small { font-size:11px; }
  .sbtn.on { color:#ff6b6b; }
  .ri .car { position:absolute; inset:0; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; }
  .ri .car > div { flex:0 0 100%; height:100%; position:relative; scroll-snap-align:center; }
  .ri .car video, .ri .car img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .ri .cnt { position:absolute; top:56px; left:12px; background:rgba(0,0,0,.5); border-radius:10px; padding:0 8px; font-size:12px; z-index:2; }
  .ri .ad { position:absolute; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; z-index:3; }
  .poll { position:absolute; right:12px; left:76px; bottom:110px; background:rgba(0,0,0,.55); border-radius:12px; padding:8px; z-index:2; }
  .poll button { display:block; width:100%; text-align:start; margin:4px 0; background:rgba(255,255,255,.15); border:none; color:#fff; position:relative; overflow:hidden; }
  .poll button i { position:absolute; inset:0 auto 0 0; background:rgba(63,182,173,.5); z-index:0; }
  .poll button span { position:relative; z-index:1; }
  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:19; }
  .sheet { position:fixed; right:0; left:0; bottom:0; max-height:78dvh; background:var(--card); color:var(--ink); border-radius:18px 18px 0 0; z-index:20; display:flex; flex-direction:column; }
  .sheet .sh { padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); font-weight:bold; }
  .sheet .sb { overflow:auto; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); }
  .sheet .sb button.menu { display:block; width:100%; text-align:start; margin-bottom:8px; background:transparent; color:var(--ink); border:1px solid var(--line); }
  .cm { margin-bottom:10px; }
  .cm.rep { margin-right:24px; }
  .cm .t { white-space:pre-wrap; word-break:break-word; }
  .cm .meta { font-size:12px; color:var(--muted); }
  .cm img.cmimg, .t img.cmimg { max-width:100%; max-height:220px; border-radius:10px; display:block; }
  /* ---- شبکه‌ی پست‌ها ---- */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; margin-bottom:16px; }
  .th { position:relative; aspect-ratio:1; background:var(--line); overflow:hidden; display:block; color:var(--ink); text-decoration:none; }
  .th img, .th video { width:100%; height:100%; object-fit:cover; display:block; }
  .th .tx { padding:6px; font-size:12px; overflow:hidden; line-height:1.4; }
  .th .pin { position:absolute; top:2px; right:4px; }
  .th .x { position:absolute; top:2px; left:2px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:50%; width:24px; height:24px; padding:0; }
  .ring { display:inline-flex; padding:2px; border-radius:50%; background:linear-gradient(45deg,#f0b429,#d6336c); }
  .ring.seen { background:var(--line); }
  .tray { display:flex; gap:14px; overflow-x:auto; padding-bottom:12px; }
  .tray a, .tray button.st { display:flex; flex-direction:column; align-items:center; font-size:12px; text-decoration:none; color:var(--ink); background:transparent; border:none; padding:0; min-width:64px; }
  .story { position:fixed; inset:0; background:#000; z-index:40; color:#fff; display:flex; flex-direction:column; }
  .story .sm { flex:1; position:relative; }
  .story .sm img, .story .sm video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .story .stxt { position:absolute; right:0; left:0; bottom:80px; text-align:center; padding:12px; text-shadow:0 1px 3px #000; }
  .story .shead { position:absolute; top:0; right:0; left:0; z-index:2; padding:12px; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(rgba(0,0,0,.6),transparent); }
  .story .sbar { position:absolute; top:4px; right:8px; left:8px; height:3px; background:rgba(255,255,255,.3); z-index:3; }
  .story .sbar i { display:block; height:100%; background:#fff; width:0; }
  .story .sfoot { padding:10px; display:flex; gap:10px; justify-content:center; background:#000; }
  .story .sfoot button { background:transparent; border:none; font-size:26px; padding:2px 6px; }
  .bubbles { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .b { max-width:85%; padding:8px 12px; border-radius:16px; background:var(--card); border:1px solid var(--line); word-break:break-word; white-space:pre-wrap; align-self:flex-end; }
  .b.me { align-self:flex-start; background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .bn { font-size:12px; font-weight:bold; color:var(--accent); text-decoration:none; display:block; }
  .b.me .bn { color:var(--accent-ink); }
  .bt { font-size:11px; opacity:.7; }
  .sendbar { display:flex; gap:8px; position:sticky; bottom:calc(var(--navh) + 4px); background:var(--bg); padding:8px 0; }
  table.st { width:100%; border-collapse:collapse; font-size:13px; }
  table.st td, table.st th { border-bottom:1px solid var(--line); padding:4px; text-align:center; }
</style>
</head>
<body>

<header>
  <h1>تجربه‌ها</h1>
  <div class="row">
    <button id="bellBtn" class="ghost small" aria-label="اعلان‌ها" style="display:none">🔔</button>
    <button id="themeBtn" class="ghost small" aria-label="حالت تاریک">🌙</button>
    <button id="loginTop" class="ghost small" style="display:none">ورود / ثبت‌نام</button>
  </div>
</header>

<main id="view"></main>

<nav>
  <a href="#/posts" data-p="posts"><span class="ic">⌂</span>پست‌ها</a>
  <a href="#/search" data-p="search"><span class="ic">⌕</span>جستجو</a>
  <a href="#/new" data-p="new"><span class="ic">＋</span>پست جدید</a>
  <a href="#/chat" data-p="chat"><span class="ic">✉</span>چت</a>
  <a href="#/me" data-p="me"><span class="ic">☺</span>صفحه من</a>
</nav>

<div id="msg"></div>
<script>
// ============ تنظیمات ============
const CONFIG = {
  endpoint: 'https://fra.cloud.appwrite.io/v1',
  projectId: '6ace411d003d049156b2',
  databaseId: '6acf982f001971779a2c',
  collectionId: '6acf990e0020720c9550',   // جدول posts
  bucketId: '6acf9c8b003cff99b09a',
  messagesId: '6ad0beeb0037f9256400',     // جدول messages
  actionsId: '6ad1b34a000658debecf',     // جدول actions
  adminId: '6ad35ef600051b331fd3',                            // جدول admin (اختیاری، برای پنل ادمین)
  reportsId: '6ad3b704001fdf44a5dc',        // جدول reports (گزارش‌ها و پشتیبانی)
  supportTelegram: '@botboshtibani',
  premiumPrice: '۵۰٬۰۰۰ تومان',
  cardNumber: '',                         // شماره کارت رو خودت اینجا بذار
  maxFileMB: 20, maxVideoSeconds: 60, maxImageWidth: 1280, imageQuality: 0.75, keepDays: 7
};
// =================================

if (!window.Appwrite) {
  document.getElementById('view').innerHTML = '<div class="empty">کتابخونه‌ی Appwrite بارگذاری نشد. اینترنت یا فیلترشکن رو چک کن و صفحه رو دوباره باز کن.</div>';
  throw new Error('Appwrite SDK not loaded');
}
const { Client, Account, Databases, Storage, ID, Query, Permission, Role } = Appwrite;
const client = new Client().setEndpoint(CONFIG.endpoint).setProject(CONFIG.projectId);
const account = new Account(client);
const databases = new Databases(client);
const storage = new Storage(client);
const DB = CONFIG.databaseId, POSTS = CONFIG.collectionId, MSG = CONFIG.messagesId;
const ACT = () => CONFIG.actionsId;

const $ = id => document.getElementById(id);
const view = $('view');
const KEEP_MS = CONFIG.keepDays * 24 * 3600 * 1000;
let user = null;
let prefs = { types: {}, authors: {} };

// ---------- ابزارها ----------
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === 'class') e.className = props[k];
    else if (k.startsWith('on')) e[k] = props[k];
    else e.setAttribute(k, props[k]);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function toast(t) {
  const m = $('msg'); m.textContent = t; m.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 4000);
}
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const fileUrl = id => `${CONFIG.endpoint}/storage/buckets/${CONFIG.bucketId}/files/${id}/view?project=${CONFIG.projectId}`;
function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + ' دقیقه پیش';
  if (s < 86400) return Math.floor(s / 3600) + ' ساعت پیش';
  return Math.floor(s / 86400) + ' روز پیش';
}
const me = () => user ? (user.name || user.email.split('@')[0]) : '';
const own = id => !!user && user.$id === id;
const isAdmin = () => !!user && (user.labels || []).includes('admin');
async function hid(prefix, str) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return prefix + [...new Uint8Array(b)].slice(0, 16).map(x => x.toString(16).padStart(2, '0')).join('');
}
const pubPerms = () => [Permission.read(Role.any()), Permission.delete(Role.user(user.$id))];
const pubUpd = () => [Permission.read(Role.any()), Permission.update(Role.user(user.$id)), Permission.delete(Role.user(user.$id))];
const privPerms = () => [Permission.read(Role.user(user.$id)), Permission.delete(Role.user(user.$id))];
const actionsReady = () => !!CONFIG.actionsId && !CONFIG.actionsId.startsWith('YOUR');
const adminReady = () => !!CONFIG.adminId;
const IMG_URL = /https?:\/\/\S+\.(gif|png|jpe?g|webp)(\?\S*)?/i;
const IMG_MARK = /\[\[img:([A-Za-z0-9_.-]+)\]\]/;

// ---------- حالت تاریک ----------
function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙'; }
let theme = lsGet('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(theme);
function toggleTheme() { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme); lsSet('theme', theme); }
$('themeBtn').onclick = toggleTheme;
$('loginTop').onclick = () => { location.hash = '#/login'; };

// ---------- کاربر و چند حساب ----------
async function checkUser() {
  try { user = await account.get(); } catch { user = null; }
  const p = (user && user.prefs) || {};
  prefs = { types: p.types || {}, authors: p.authors || {} };
  $('loginTop').style.display = user ? 'none' : '';
  $('bellBtn').style.display = user ? '' : 'none';
  if (user) snapshotAccount();
}
function snapshotAccount() {
  const fb = lsGet('cookieFallback');
  if (!fb) return;
  try { const m = JSON.parse(lsGet('accts') || '{}'); m[user.$id] = { name: me(), fb }; lsSet('accts', JSON.stringify(m)); } catch {}
}
let saveT;
function savePrefs() {
  if (!user) return;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try {
      prefs.authors = Object.fromEntries(Object.entries(prefs.authors).sort((a, b) => b[1] - a[1]).slice(0, 40));
      await account.updatePrefs(prefs);
    } catch {}
  }, 4000);
}

// ---------- داده‌ی تعامل‌ها ----------
let A = { rows: [], views: [], loaded: 0 };
let AD = { rows: [], loaded: 0, verified: new Set(), premium: new Map(), bans: new Map() };
function addTo(map, key, val) { if (!map.has(key)) map.set(key, new Set()); map.get(key).add(val); }
function pushTo(map, key, val) { if (!map.has(key)) map.set(key, []); map.get(key).push(val); }
const jparse = s => { try { return JSON.parse(s || '{}'); } catch { return {}; } };
function indexActions() {
  A.likes = new Map(); A.dislikes = new Map(); A.comments = new Map(); A.followers = new Map(); A.following = new Map();
  A.names = new Map(); A.profiles = new Map(); A.mySaves = []; A.blocked = new Set(); A.notify = new Set();
  A.pinPost = new Map(); A.pinCm = new Map(); A.stories = []; A.reacts = new Map(); A.polls = new Map();
  A.votes = new Map(); A.meta = new Map(); A.vw = new Map();
  const dayAgo = Date.now() - 24 * 3600 * 1000;
  for (const r of A.rows) {
    const mine = user && r.userId === user.$id;
    switch (r.kind) {
      case 'like': addTo(A.likes, r.targetId, r.userId); break;
      case 'dislike': addTo(A.dislikes, r.targetId, r.userId); break;
      case 'comment': pushTo(A.comments, r.targetId, r); break;
      case 'follow': addTo(A.followers, r.targetId, r.userId); addTo(A.following, r.userId, r.targetId); break;
      case 'name': if (!A.names.has(r.userId)) A.names.set(r.userId, r.userName); break;
      case 'profile': A.profiles.set(r.userId, jparse(r.data)); break;
      case 'save': if (mine) A.mySaves.push(r); break;
      case 'block': if (mine) A.blocked.add(r.targetId); break;
      case 'notify': if (mine) A.notify.add(r.targetId); break;
      case 'pinpost': if (!A.pinPost.has(r.userId)) A.pinPost.set(r.userId, r.targetId); break;
      case 'pincm': if (!A.pinCm.has(r.targetId)) A.pinCm.set(r.targetId, { by: r.userId, cid: r.text }); break;
      case 'story': if (new Date(r.$createdAt).getTime() > dayAgo) A.stories.push(r); break;
      case 'react': pushTo(A.reacts, r.targetId, r); break;
      case 'poll': if (!A.polls.has(r.targetId)) A.polls.set(r.targetId, { by: r.userId, ...jparse(r.data) }); break;
      case 'vote': if (!A.votes.has(r.targetId)) A.votes.set(r.targetId, new Map()); A.votes.get(r.targetId).set(r.userId, +r.text); break;
      case 'meta': if (!A.meta.has(r.targetId)) A.meta.set(r.targetId, { by: r.userId, ...jparse(r.data) }); break;
    }
  }
  for (const r of A.views) pushTo(A.vw, r.targetId, r);
  for (const l of A.comments.values()) l.sort((a, b) => new Date(a.$createdAt) - new Date(b.$createdAt));
  A.stories.sort((a, b) => new Date(a.$createdAt) - new Date(b.$createdAt));
}
indexActions();
async function pageAll(col, queries, maxPages) {
  let out = [];
  for (let p = 0; p < maxPages; p += 3) {
    const n = Math.min(3, maxPages - p);
    const res = await Promise.all(Array.from({ length: n }, (_, i) =>
      databases.listDocuments(DB, col, [...queries, Query.limit(100), Query.offset((p + i) * 100)])));
    let full = true;
    for (const r of res) { out = out.concat(r.documents); if (r.documents.length < 100) full = false; }
    if (!full) break;
  }
  return out;
}
async function fetchActions(force) {
  if (!actionsReady()) return;
  if (!force && A.loaded && Date.now() - A.loaded < 20000) return;
  let core, views;
  try {
    [core, views] = await Promise.all([
      pageAll(ACT(), [Query.notEqual('kind', ['view']), Query.orderDesc('$createdAt')], 10),
      pageAll(ACT(), [Query.equal('kind', ['view']), Query.orderDesc('$createdAt')], 10)]);
  } catch (e) {
    const all = await pageAll(ACT(), [Query.orderDesc('$createdAt')], 15);
    core = all.filter(r => r.kind !== 'view'); views = all.filter(r => r.kind === 'view');
  }
  A.rows = core; A.views = views; A.loaded = Date.now(); indexActions();
}
function addRow(doc) { A.rows.unshift(doc); indexActions(); }
function removeRow(id) { A.rows = A.rows.filter(r => r.$id !== id); indexActions(); }
async function fetchAdmin(force) {
  if (!adminReady()) return;
  if (!force && AD.loaded && Date.now() - AD.loaded < 60000) return;
  try { AD.rows = await pageAll(CONFIG.adminId, [Query.orderDesc('$createdAt')], 5); } catch { AD.rows = []; }
  AD.loaded = Date.now();

  for (const r of AD.rows) {

}

let allPosts = [], loadedAt = 0;

function canSee(d) {
  if (own(d.userId)) return true;
  if (A.blocked.has(d.userId)) return false;
  const m = A.meta.get(d.$id);
  if (m && m.by === d.userId) {
    if (m.publishAt && new Date(m.publishAt).getTime() > Date.now()) return false;
    if (m.priv && !(user && (A.following.get(user.$id) || new Set()).has(d.userId))) return false;
  }
  return true;
}
const visible = list => list.filter(canSee);
function rank(list) {
  const total = Object.values(prefs.types).reduce((a, b) => a + b, 0) || 1;
  const now = Date.now();
  return list.map(d => {
    const age = Math.min(1, (now - new Date(d.$createdAt)) / KEEP_MS);
    const typeW = (prefs.types[d.type] || 0) / total * 3;
    const authW = Math.min(prefs.authors[d.userId] || 0, 10) / 10 * 3;
    const likeW = Math.min((A.likes.get(d.$id) || new Set()).size, 10) / 10;
    const disW = Math.min((A.dislikes.get(d.$id) || new Set()).size, 10) / 10;
    const mine = own(d.userId) ? -1.5 : 0;
    return { d, s: typeW + authW + likeW - disW + 2 * (1 - age) + Math.random() * 0.8 + mine };
  }).sort((a, b) => b.s - a.s).map(x => x.d);
}
const seen = new Set();
function record(id, type, uid, w) {
  if (!user) return;
  if (w === 1) { if (seen.has(id)) return; seen.add(id); }
  prefs.types[type] = (prefs.types[type] || 0) + w;
  if (uid !== user.$id) prefs.authors[uid] = (prefs.authors[uid] || 0) + w;
  savePrefs();
}
const watched = {};
async function recordView(targetId, ownerId) {
  if (!user || own(ownerId) || !actionsReady() || watched[targetId]) return;
  watched[targetId] = await hid('w', user.$id + targetId);
  if ((A.vw.get(targetId) || []).some(r => r.userId === user.$id)) return;
  try {
    const doc = await databases.createDocument(DB, ACT(), watched[targetId], { kind: 'view', userId: user.$id, targetId, text: '0' }, pubUpd());
    A.views.unshift(doc); pushTo(A.vw, targetId, doc);
  } catch {}
}
const watchSent = {};
async function sendWatch(targetId, secs) {
  const id = watched[targetId];
  if (!id || secs < 1 || Math.abs((watchSent[targetId] || 0) - secs) < 2) return;
  watchSent[targetId] = secs;
  try { await databases.updateDocument(DB, ACT(), id, { text: String(Math.round(secs)) }); } catch {}
}

let closeSheetFn = null;
function openSheet(title, body) {
  if (closeSheetFn) closeSheetFn();

  const sheet = h('div', { class: 'sheet', role: 'dialog' },
    h('div', { class: 'sh' }, h('span', {}, title), h('button', { class: 'ghost small', onclick: () => closeSheetFn && closeSheetFn() }, '✕')),
    h('div', { class: 'sb' }, body));

  document.body.append(back, sheet);
  closeSheetFn = () => { back.remove(); sheet.remove(); closeSheetFn = null; };

function cmImg(src) {
  const im = h('img', { class: 'cmimg', src, alt: '', style: 'min-height:48px;background:var(--line)', referrerpolicy: 'no-referrer' });
  im.onerror = () => im.replaceWith(h('a', { href: src, target: '_blank', rel: 'noopener nofollow' }, '🖼 باز کردن عکس'));
  return im;
}
function richText(text) {
  const out = [];
  const re = /(#[\p{L}\p{N}_]+)|(\[\[img:([A-Za-z0-9_.-]+)\]\])|(https?:\/\/\S+)/gu;
  let last = 0, m;
  while ((m = re.exec(text || ''))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[1]) out.push(h('a', { href: '#/search/' + encodeURIComponent(m[1]) }, m[1]));
    else if (m[3]) out.push(cmImg(fileUrl(m[3])));
    else if (IMG_URL.test(m[4])) out.push(cmImg(m[4]));
    else out.push(h('a', { href: m[4], target: '_blank', rel: 'noopener nofollow ugc' }, m[4]));
    last = m.index + m[0].length;
  }
  if (last < (text || '').length) out.push(text.slice(last));
  return out;
}

// ---------- مشاهده‌گرها (باید با هر صفحه دوباره ساخته بشن) ----------
let io = null, ro = null;
let globalMuted = true;
function newObservers() {
  if (io) io.disconnect();
  if (ro) ro.disconnect();
  io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const el = e.target;
      if (e.isIntersecting) el._t = setTimeout(() => { record(el.dataset.id, el.dataset.type, el.dataset.uid, 1); recordView(el.dataset.id, el.dataset.uid); }, 1500);
      else clearTimeout(el._t);
    }
  }, { threshold: 0.6 });
  ro = new IntersectionObserver(entries => {
    for (const e of entries) {
      const v = e.target;
      if (e.isIntersecting) { if (!v._hold) { v.muted = globalMuted; v.play().catch(() => {}); } }
      else { v.pause(); if (v._postId) sendWatch(v._postId, v.currentTime); }
    }
  }, { threshold: 0.7 });
}

  };

  gifBtn.onclick = () => {
    if (!user) return toast('اول وارد شو');
    if (!isPremium(user.$id)) return toast('گیف و عکس تو کامنت فقط برای اشتراک پرمیومه. بخش «قوانین و پشتیبانی» رو ببین.');
    gifIn.click();
  };
  gifIn.onchange = async () => {
    const f = gifIn.files[0]; if (!f) return;

      if (up.size > CONFIG.maxFileMB * 1024 * 1024) throw new Error('حجم فایل زیاده');
      const saved = await storage.createFile(CONFIG.bucketId, ID.unique(), up, [Permission.read(Role.any()), Permission.delete(Role.user(user.$id))]);
      const t = (input.value.trim() + ' [[img:' + saved.$id + ']]').trim();

    gifBtn.disabled = false; gifIn.value = '';
  };
  send.onclick = async () => {
    const t = input.value.trim(); if (!t) return;

    if (await addComment(d, t, replyTo ? replyTo.$id : null)) { replyTo = null; input.value = ''; input.placeholder = 'کامنت بنویس...'; draw(); onChange(); }

function compressImage(file, maxW, q) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(new File([b], 'photo.jpg', { type: 'image/jpeg' })) : reject('فشرده‌سازی عکس انجام نشد'), 'image/jpeg', q);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject('این عکس باز نشد');
    img.src = URL.createObjectURL(file);
  });
}
function videoDuration(file) {
  return new Promise((resolve, reject) => {
    const v = document.createElement('video'); v.preload = 'metadata';
    v.onloadedmetadata = () => { URL.revokeObjectURL(v.src); resolve(v.duration); };
    v.onerror = () => reject('این ویدیو باز نشد');
    v.src = URL.createObjectURL(file);
  });
}
async function uploadMedia(f, status) {
  let upload = f, type;
  if (f.type.startsWith('image/')) { type = 'image'; status.textContent = 'در حال فشرده‌سازی عکس...'; upload = await compressImage(f, CONFIG.maxImageWidth, CONFIG.imageQuality); }
  else if (f.type.startsWith('video/')) { type = 'video'; if ((await videoDuration(f)) > CONFIG.maxVideoSeconds) throw `ویدیو باید حداکثر ${CONFIG.maxVideoSeconds} ثانیه باشه`; }
  else throw 'فقط عکس یا ویدیو';
  if (upload.size > CONFIG.maxFileMB * 1024 * 1024) throw `حجم هر فایل باید کمتر از ${CONFIG.maxFileMB} مگابایت باشه`;
  status.textContent = 'در حال آپلود...';
  const saved = await storage.createFile(CONFIG.bucketId, ID.unique(), upload, [Permission.read(Role.any()), Permission.delete(Role.user(user.$id))]);
  return { id: saved.$id, type };
}

async function myKeyPair() {

  const search = h('input', { placeholder: 'شروع گفتگوی جدید: اسم کاربر رو بنویس' });
  const res = h('div');
  search.oninput = () => {
    res.innerHTML = ''; const q = search.value.trim().toLowerCase(); if (!q) return;
    A.names.forEach((n, id) => { if (id !== user.$id && n.toLowerCase().includes(q)) res.append(h('a', { class: 'chip', href: '#/chat/dm/' + id }, avatar(id, n), nameEl(id, n))); });
  };
  out.append(search, res);
  try {
    const msgs = await fetchDMs(); const last = new Map();
    msgs.forEach(m => { const o = m.userId === user.$id ? m.toId : m.userId; if (!last.has(o)) last.set(o, m); });
    out.append(h('h3', {}, 'گفتگوها'));
    if (!last.size) out.append(h('div', { class: 'empty' }, 'هنوز گفتگویی نداری.'));
    last.forEach((m, o) => out.append(h('a', { class: 'chip', href: '#/chat/dm/' + o }, avatar(o, nameOf(o, null)), nameEl(o, null), ' · ' + timeAgo(m.$createdAt))));
  } catch (e) { out.append(h('div', { class: 'empty' }, 'بارگذاری نشد: ' + (e.message || ''))); }
}
async function viewDM(otherId) {
  view.innerHTML = '';
  const head = h('div', { class: 'row', style: 'margin-bottom:8px' }, h('a', { href: '#/chat/dms' }, '←'), h('a', { class: 'who', href: '#/u/' + otherId, style: 'display:flex;gap:8px;align-items:center;text-decoration:none' }, avatar(otherId, nameOf(otherId, null)), nameEl(otherId, null)));
  const box = h('div', { class: 'bubbles' });
  const input = h('input', { placeholder: 'پیام خصوصی (حداکثر ۲۵۰ حرف)...', maxlength: '250', style: 'flex:1;margin:0' });
  const send = h('button', {}, 'ارسال');
  view.append(head, box, h('div', { class: 'sendbar' }, input, send));
  let key;
  try { await fetchActions(true); await ensurePub(); key = await dmKey(otherId); }
  catch (e) { box.append(h('div', { class: 'empty' }, e.message || 'چت خصوصی فعال نشد')); send.disabled = true; return; }
  let lastKey = null;
  const load = async () => {
    try {
      const all = (await fetchDMs()).filter(m => (m.userId === user.$id && m.toId === otherId) || (m.userId === otherId && m.toId === user.$id)).reverse();
      const k = all.map(m => m.$id).join(','); if (k === lastKey) return; lastKey = k;
      box.innerHTML = '';
      if (!all.length) box.append(h('div', { class: 'empty' }, 'هنوز پیامی نیست.'));
      for (const m of all) {
        let t; try { t = await dmDec(key, m.text); } catch { t = '🔒 این پیام با کلید این دستگاه قابل خوندن نیست'; }
        box.append(h('div', { class: 'b' + (own(m.userId) ? ' me' : '') }, h('div', {}, t),
          h('div', { class: 'bt' }, timeAgo(m.$createdAt), own(m.userId) && ' · ',
            own(m.userId) && h('a', { href: '#', class: 'bn', style: 'display:inline', onclick: async e => { e.preventDefault(); if (!confirm('پیام حذف بشه؟')) return; try { await databases.deleteDocument(DB, MSG, m.$id); lastKey = null; load(); } catch (er) { toast(er.message || 'حذف نشد'); } } }, 'حذف'))));
      }
      window.scrollTo(0, document.body.scrollHeight);
    } catch (e) { box.innerHTML = '<div class="empty">بارگذاری نشد: ' + (e.message || '') + '</div>'; }
  };
  send.onclick = async () => {
    const t = input.value.trim(); if (!t) return;
    send.disabled = true;
    try {
      await databases.createDocument(DB, MSG, ID.unique(), { userId: user.$id, userName: me(), toId: otherId, text: await dmEnc(key, t) }, [Permission.read(Role.users()), Permission.delete(Role.user(user.$id))]);
      input.value = ''; lastKey = null; await load();
    } catch (e) { toast(e.message || 'ارسال نشد'); }
    send.disabled = false;
  };
  input.onkeydown = e => { if (e.key === 'Enter') send.onclick(); };
  await load(); chatTimer = setInterval(load, 5000);
}

// ---------- اعلان‌ها ----------
function computeNotifs() {
  if (!user) return [];
  const mineIds = new Map(allPosts.filter(p => p.userId === user.$id).map(p => [p.$id, p]));
  const myStories = new Set(A.stories.filter(s => s.userId === user.$id).map(s => s.$id));
  const myCm = new Set(A.rows.filter(r => r.kind === 'comment' && r.userId === user.$id).map(r => r.$id));
  const out = [], nm = r => nameOf(r.userId, r.userName);
  for (const r of A.rows) {
    if (r.userId === user.$id) continue;
    const t = new Date(r.$createdAt).getTime();
    if (r.kind === 'like' && mineIds.has(r.targetId)) out.push({ t, text: nm(r) + ' پستت رو لایک کرد', link: '#/p/' + r.targetId });
    else if (r.kind === 'comment' && mineIds.has(r.targetId)) out.push({ t, text: nm(r) + ' برای پستت کامنت گذاشت', link: '#/p/' + r.targetId });
    else if (r.kind === 'comment' && r.parentId && myCm.has(r.parentId)) out.push({ t, text: nm(r) + ' به کامنتت پاسخ داد', link: '#/p/' + r.targetId });
    else if (r.kind === 'follow' && r.targetId === user.$id) out.push({ t, text: nm(r) + ' دنبالت کرد', link: '#/u/' + r.userId });
    else if (r.kind === 'react' && myStories.has(r.targetId)) out.push({ t, text: nm(r) + ' به استوریت واکنش داد ' + r.text, link: '#/posts' });
    else if (r.kind === 'vote' && mineIds.has(r.targetId)) out.push({ t, text: nm(r) + ' تو نظرسنجیت رأی داد', link: '#/p/' + r.targetId });
  }
  for (const p of allPosts) if (A.notify.has(p.userId) && canSee(p)) out.push({ t: new Date(p.$createdAt).getTime(), text: nameOf(p.userId, p.userName) + ' پست جدید گذاشت', link: '#/p/' + p.$id });
  return out.sort((a, b) => b.t - a.t).slice(0, 60);
}
function notifCount() {
  if (!user) return 0;
  try { const s = +lsGet('seenAt_' + user.$id) || 0; return computeNotifs().filter(n => n.t > s).length; } catch { return 0; }
}
async function viewNotifs() {
  document.body.classList.remove('reelmode');
  if (!user) { location.hash = '#/login'; return; }
  view.innerHTML = '<div class="empty">در حال بارگذاری...</div>';
  try { await Promise.all([fetchPosts(false), fetchActions(true)]); } catch {}
  const s = +lsGet('seenAt_' + user.$id) || 0, list = computeNotifs();
  view.innerHTML = '';
  view.append(h('h2', {}, 'اعلان‌ها'), h('p', { class: 'muted' }, 'اعلان‌ها فقط تو خود سایت نشون داده می‌شن (نوتیفیکیشن گوشی ندارن).'));
  if (!list.length) view.append(h('div', { class: 'empty' }, 'اعلانی نیست.'));
  list.forEach(n => view.append(h('a', { href: n.link, style: 'display:block;padding:10px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);' + (n.t > s ? 'font-weight:bold' : '') }, n.text, h('div', { class: 'muted' }, timeAgo(new Date(n.t).toISOString())))));
  lsSet('seenAt_' + user.$id, String(Date.now())); updateBell();
}
function updateBell() { const n = notifCount(); $('bellBtn').textContent = '🔔' + (n ? ' ' + n : ''); }
$('bellBtn').onclick = () => { location.hash = '#/notifs'; };

// ---------- پنل ادمین ----------
async function adminDoc(kind, targetId, days, text) {
  const id = await hid('a' + kind.slice(0, 2), targetId);
  try { await databases.deleteDocument(CONFIG.adminId, id, id); } catch {}
}
async function adminPut(kind, uid, days, text) {
  if (!adminReady()) throw new Error('جدول ادمین هنوز تنظیم نشده');
  const id = await hid('a' + kind.slice(0, 2), uid);
  try { await databases.deleteDocument(DB, CONFIG.adminId, id); } catch {}
  const data = { kind, targetId: uid, text: (text || '').slice(0, 500) };
  if (days) data.until = new Date(Date.now() + days * 864e5).toISOString();
  await databases.createDocument(DB, CONFIG.adminId, id, data, [Permission.read(Role.any()), Permission.update(Role.label('admin')), Permission.delete(Role.label('admin'))]);
}
async function adminDel(kind, uid) {
  try { await databases.deleteDocument(DB, CONFIG.adminId, await hid('a' + kind.slice(0, 2), uid)); } catch {}
}
async function adminBan(uid) {
  if (!isAdmin()) return;
  const n = prompt('چند روز بن بشه؟ (مثلاً 1 یا 90 یا 365 یا 1825)', '1');
  const days = parseInt(n, 10);
  if (!days || days < 1) return;
  const reason = prompt('دلیل بن (اختیاری)') || '';
  try { await adminPut('ban', uid, days, reason); await fetchAdmin(true); toast(`${nameOf(uid, 'کاربر')} تا ${days} روز دیگه بن شد`); } catch (e) { toast(e.message || 'بن انجام نشد'); }
}

  sec('پرمیوم‌ها', [...AD.premium].map(([id, u]) => h('div', {}, nameOf(id, null) + ' تا ' + new Date(u).toLocaleDateString('fa-IR'))));

  if (CONFIG.reportsId) {

    try {

// ---------- ورود ----------
function viewLogin() {
  document.body.classList.remove('reelmode');
  view.innerHTML = '';
  const email = h('input', { type: 'email', placeholder: 'ایمیل', dir: 'ltr' });
  const code = h('input', { placeholder: 'کد ۶ رقمی', dir: 'ltr', inputmode: 'numeric', maxlength: '6' });
  const info = h('p', { class: 'muted' });
  const sendBtn = h('button', {}, 'ارسال کد به ایمیل'), enterBtn = h('button', {}, 'ورود');
  let userId = null;
  const step1 = h('div', {}, email, sendBtn);
  const back = h('button', { class: 'ghost', onclick: () => { step2.style.display = 'none'; step1.style.display = ''; } }, 'تغییر ایمیل');
  const step2 = h('div', { style: 'display:none' }, info, code, h('div', { class: 'row' }, enterBtn, back));
  sendBtn.onclick = async () => {
    if (!email.value.trim()) return toast('ایمیلت رو بنویس');
    sendBtn.disabled = true;
    try {
      const t = await account.createEmailToken(ID.unique(), email.value.trim()); userId = t.userId;
      info.textContent = 'یه کد به ' + email.value.trim() + ' فرستادیم. پوشه‌ی اسپم رو هم نگاه کن.';
      step1.style.display = 'none'; step2.style.display = ''; code.focus();
    } catch (e) { toast(e.message || 'کد فرستاده نشد'); }
    sendBtn.disabled = false;
  };
  enterBtn.onclick = async () => {
    enterBtn.disabled = true;
    try { await account.createSession(userId, code.value.trim()); await checkUser(); location.hash = '#/posts'; route(); }
    catch (e) { toast(e.message || 'کد درست نیست'); }
    enterBtn.disabled = false;
  };
  view.append(h('section', { class: 'box' }, h('h2', { style: 'margin-top:0' }, 'ورود یا ثبت‌نام'),
    h('p', { class: 'muted' }, 'رمز لازم نیست. یه کد به ایمیلت می‌فرستیم و با همون وارد می‌شی. تا کد رو وارد نکنی وارد برنامه نمی‌شی.'), step1, step2));
}
function verifyNotice() {
  return h('section', { class: 'box' }, h('h2', { style: 'margin-top:0' }, 'ایمیلت رو تأیید کن'),
    h('p', {}, 'برای استفاده از برنامه باید ایمیلت تأیید بشه. لینک رو تو همین مرورگر باز کن.'),
    h('div', { class: 'row' },
      h('button', { onclick: async () => { try { await account.createVerification(location.origin + location.pathname); toast('ایمیل فرستاده شد'); } catch (e) { toast(e.message || 'ارسال نشد'); } } }, 'ارسال ایمیل تأیید'),
      h('button', { class: 'ghost', onclick: async () => { await checkUser(); route(); } }, 'تأیید کردم')));
}

// ---------- مسیریابی ----------
function route() {
  const navEl = document.querySelector('nav');
  clearInterval(chatTimer);
  if (closeSheetFn) closeSheetFn();
  document.body.classList.remove('reelmode');
  newObservers();
  if (user && !user.emailVerification) { navEl.style.display = 'none'; view.innerHTML = ''; view.append(verifyNotice(), h('button', { class: 'ghost', onclick: logout }, 'خروج')); return; }
  if (user && !user.name && actionsReady()) { navEl.style.display = 'none'; viewChooseName(); return; }
  const ban = user && AD.bans.get(user.$id);
  if (ban) { navEl.style.display = 'none'; view.innerHTML = ''; view.append(h('section', { class: 'box' }, h('h2', { style: 'margin-top:0' }, '🚫 حسابت بن شده'), h('p', {}, 'تا تاریخ ' + new Date(ban.until).toLocaleDateString('fa-IR') + (ban.reason ? ' به این دلیل: ' + ban.reason : '')), h('button', { class: 'ghost', onclick: logout }, 'خروج'))); return; }
  navEl.style.display = '';
  const [path, query] = (location.hash || '#/posts').split('?');
  const parts = path.split('/');
  const page = parts[1] || 'posts', arg = parts[2] ? decodeURIComponent(parts[2]) : undefined;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.p === page || (a.dataset.p === 'me' && page === 'u' && own(arg))));
  if (page !== 'chat') window.scrollTo(0, 0);
  updateBell();
  if (page === 'chat') viewChat(parts[2], parts[3]);
  else if (page === 'search') viewSearch(arg);
  else if (page === 'u' && arg) viewProfile(arg);
  else if (page === 'f' && arg) viewPeople(arg, parts[3]);
  else if (page === 'p' && arg) viewSinglePost(arg);
  else if (page === 'me') { if (!user) location.hash = '#/login'; else viewProfile(user.$id); }
  else if (page === 'new') viewNew(query === 'story');
  else if (page === 'notifs') viewNotifs();
  else if (page === 'rules') viewRules();
  else if (page === 'admin') viewAdmin();
  else if (page === 'login') viewLogin();
  else viewPosts();
}
window.addEventListener('hashchange', route);
(async () => {
  const qs = new URLSearchParams(location.search);
  if (qs.get('userId') && qs.get('secret')) {
    try { await account.updateVerification(qs.get('userId'), qs.get('secret')); toast('ایمیلت تأیید شد'); }
    catch (e) { toast('لینک تأیید معتبر نیست یا باید تو همون مرورگری که واردش شدی بازش کنی'); }
    history.replaceState(null, '', location.pathname + (location.hash || ''));
  }
  await checkUser();
  fetchAdmin(true).then(() => { if (user && AD.bans.get(user.$id)) route(); }).catch(() => {});
  if (user && user.name && actionsReady()) claimName(user.name).catch(() => {});
  route();
})();
