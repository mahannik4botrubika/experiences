<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربه‌ها</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0"></script>
<script>window.Appwrite||document.write('<script src="https://unpkg.com/appwrite@16.0.0"><\/script>')</script>
<script>window.Appwrite||document.write('<script src="https://gcore.jsdelivr.net/npm/appwrite@16.0.0"><\/script>')</script>
<style>
  :root { --bg:#f6f3ee; --card:#ffffff; --ink:#1d2a2a; --muted:#6b7777; --accent:#1f6f6b; --accent-ink:#ffffff; --line:#e3ded5; --danger:#b3412f; }
  :root[data-theme="dark"] { --bg:#14181a; --card:#1d2326; --ink:#e8eeee; --muted:#9aa8a8; --accent:#3fb6ad; --accent-ink:#0b1414; --line:#2c3538; --danger:#e07a67; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Tahoma,"Segoe UI",system-ui,sans-serif; line-height:1.7; padding-bottom:76px; }
  header { padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; margin:0; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:16px; overflow:hidden; }
  .card .head { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; gap:8px; }
  .who { display:flex; align-items:center; gap:10px; color:inherit; text-decoration:none; font-weight:bold; }
  .avatar { width:36px; height:36px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:inline-flex; align-items:center; justify-content:center; font-weight:bold; flex:none; object-fit:cover; }
  .avatar.big { width:72px; height:72px; font-size:30px; }
  .card img.media, .card video { width:100%; display:block; background:#000; max-height:80vh; object-fit:contain; }
  .card p { margin:0; padding:12px 14px; white-space:pre-wrap; word-break:break-word; }
  .card p.only { font-size:18px; padding:22px 16px; }
  .card .time { font-size:12px; color:var(--muted); padding:0 14px 8px; }
  input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; margin-bottom:10px; background:var(--card); color:var(--ink); }
  button { font:inherit; cursor:pointer; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); padding:9px 16px; border-radius:10px; }
  button.ghost { background:transparent; color:var(--accent); }
  button.danger { background:transparent; color:var(--danger); border-color:var(--danger); padding:4px 10px; font-size:13px; }
  button.small { padding:4px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline:3px solid #f0b429; outline-offset:2px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .profile-head { display:flex; gap:16px; align-items:center; }
  .profile-head h2 { margin:0; }
  .muted { color:var(--muted); font-size:14px; }
  .chip { display:inline-flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 12px 4px 6px; margin:0 0 8px 8px; text-decoration:none; color:inherit; }
  .links a { display:inline-block; margin:0 0 6px 8px; color:var(--accent); }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; background:transparent; color:var(--muted); border:1px solid var(--line); }
  .tab.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .bar { display:flex; gap:6px; padding:0 10px 10px; flex-wrap:wrap; }
  .act { background:transparent; color:var(--ink); border:1px solid var(--line); padding:4px 10px; font-size:14px; }
  .act.on { color:var(--danger); border-color:var(--danger); }
  .cbox { border-top:1px solid var(--line); padding:10px 14px; }
  .cm { margin-bottom:8px; }
  .cm.rep { margin-right:22px; }
  .cm .t { white-space:pre-wrap; word-break:break-word; }
  .cm .meta { font-size:12px; color:var(--muted); }
  nav { position:fixed; bottom:0; right:0; left:0; background:var(--card); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px)); z-index:6; }
  nav a { flex:1; text-align:center; text-decoration:none; color:var(--muted); font-size:13px; padding:4px 0; }
  nav a.on { color:var(--accent); font-weight:bold; }
  nav a .ic { display:block; font-size:20px; line-height:1.2; }
  #msg { position:fixed; bottom:84px; right:16px; left:16px; max-width:520px; margin:0 auto; background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:10px; display:none; z-index:10; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .bubbles { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .b { max-width:85%; padding:8px 12px; border-radius:16px; background:var(--card); border:1px solid var(--line); word-break:break-word; white-space:pre-wrap; align-self:flex-end; }
  .b.me { align-self:flex-start; background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .bn { font-size:12px; font-weight:bold; color:var(--accent); text-decoration:none; display:block; }
  .b.me .bn { color:var(--accent-ink); }
  .bt { font-size:11px; opacity:.7; }
  .sendbar { display:flex; gap:8px; position:sticky; bottom:72px; background:var(--bg); padding:8px 0; }
</style>
</head>
<body>

<header>
  <h1>تجربه‌ها</h1>
  <div class="row">
    <button id="themeBtn" class="ghost small" aria-label="حالت تاریک">🌙</button>
    <button id="loginTop" class="ghost small" style="display:none">ورود / ثبت‌نام</button>
  </div>
</header>

<main id="view"></main>

<nav>
  <a href="#/posts" data-p="posts"><span class="ic">⌂</span>پست‌ها</a>
  <a href="#/search" data-p="search"><span class="ic">⌕</span>جستجو</a>
  <a href="#/new" data-p="new"><span class="ic">＋</span>پست جدید</a>
  <a href="#/chat" data-p="chat"><span class="ic">✉</span>چت</a>
  <a href="#/me" data-p="me"><span class="ic">☺</span>صفحه من</a>
</nav>

<div id="msg"></div>

<script>
// ============ تنظیمات ============
const CONFIG = {
  endpoint: 'https://fra.cloud.appwrite.io/v1',
  projectId: '6ace411d003d049156b2',
  databaseId: '6acf982f001971779a2c',
  collectionId: '6acf990e0020720c9550',
  bucketId: '6acf9c8b003cff99b09a',
  messagesId: '6ad0beeb0037f9256400',
  actionsId: '6ad1b34a000658debecf',
  maxFileMB: 20, maxVideoSeconds: 60, maxImageWidth: 1280, imageQuality: 0.75, keepDays: 7
};
// =================================

if (!window.Appwrite) {
  document.getElementById('view').innerHTML = '<div class="empty">کتابخونه‌ی Appwrite بارگذاری نشد. اینترنت یا فیلترشکن رو چک کن و صفحه رو دوباره باز کن.</div>';
  throw new Error('Appwrite SDK not loaded');
}
const { Client, Account, Databases, Storage, ID, Query, Permission, Role } = Appwrite;
const client = new Client().setEndpoint(CONFIG.endpoint).setProject(CONFIG.projectId);
const account = new Account(client);
const databases = new Databases(client);
const storage = new Storage(client);
const DB = CONFIG.databaseId, POSTS = CONFIG.collectionId, MSG = CONFIG.messagesId;

const $ = id => document.getElementById(id);
const view = $('view');
const KEEP_MS = CONFIG.keepDays * 24 * 3600 * 1000;
let user = null;
let prefs = { types: {}, authors: {} };

// ---------- ابزارها ----------
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === 'class') e.className = props[k];
    else if (k.startsWith('on')) e[k] = props[k];
    else e.setAttribute(k, props[k]);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function toast(t) {
  const m = $('msg'); m.textContent = t; m.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 4000);
}
const fileUrl = id => `${CONFIG.endpoint}/storage/buckets/${CONFIG.bucketId}/files/${id}/view?project=${CONFIG.projectId}`;
function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + ' دقیقه پیش';
  if (s < 86400) return Math.floor(s / 3600) + ' ساعت پیش';
  return Math.floor(s / 86400) + ' روز پیش';
}
const me = () => user ? (user.name || user.email.split('@')[0]) : '';
const own = id => user && user.$id === id;
async function hid(prefix, str) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return prefix + [...new Uint8Array(b)].slice(0, 16).map(x => x.toString(16).padStart(2, '0')).join('');
}
const pubPerms = () => [Permission.read(Role.any()), Permission.delete(Role.user(user.$id))];
const privPerms = () => [Permission.read(Role.user(user.$id)), Permission.delete(Role.user(user.$id))];
const actionsReady = () => CONFIG.actionsId && !CONFIG.actionsId.startsWith('YOUR');

// ---------- حالت تاریک ----------
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
let theme = 'light';
try { theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch {}
applyTheme(theme);
$('themeBtn').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme);
  try { localStorage.setItem('theme', theme); } catch {}
};

// ---------- کاربر ----------
async function checkUser() {
  try { user = await account.get(); } catch { user = null; }
  const p = (user && user.prefs) || {};
  prefs = { types: p.types || {}, authors: p.authors || {} };
  $('loginTop').style.display = user ? 'none' : '';
}
$('loginTop').onclick = () => { location.hash = '#/login'; };
let saveT;
function savePrefs() {
  if (!user) return;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try {
      prefs.authors = Object.fromEntries(Object.entries(prefs.authors).sort((a, b) => b[1] - a[1]).slice(0, 40));
      await account.updatePrefs(prefs);
    } catch {}
  }, 4000);
}

// ---------- داده‌ی تعامل‌ها (لایک، کامنت، فالو، پروفایل...) ----------
let A = { rows: [], loaded: 0 };
function addTo(map, key, val) { if (!map.has(key)) map.set(key, new Set()); map.get(key).add(val); }
function indexActions() {
  A.likes = new Map(); A.comments = new Map(); A.followers = new Map(); A.following = new Map();
  A.names = new Map(); A.profiles = new Map(); A.mySaves = []; A.blocked = new Set();
  for (const r of A.rows) {
    if (r.kind === 'like') addTo(A.likes, r.targetId, r.userId);
    else if (r.kind === 'comment') { if (!A.comments.has(r.targetId)) A.comments.set(r.targetId, []); A.comments.get(r.targetId).push(r); }
    else if (r.kind === 'follow') { addTo(A.followers, r.targetId, r.userId); addTo(A.following, r.userId, r.targetId); }
    else if (r.kind === 'name') { if (!A.names.has(r.userId)) A.names.set(r.userId, r.userName); }
    else if (r.kind === 'profile') { try { A.profiles.set(r.userId, JSON.parse(r.data || '{}')); } catch { A.profiles.set(r.userId, {}); } }
    else if (user && r.userId === user.$id && r.kind === 'save') A.mySaves.push(r);
    else if (user && r.userId === user.$id && r.kind === 'block') A.blocked.add(r.targetId);
  }
  for (const list of A.comments.values()) list.sort((a, b) => new Date(a.$createdAt) - new Date(b.$createdAt));
}
indexActions();
async function fetchActions(force) {
  if (!actionsReady()) return;
  if (!force && A.loaded && Date.now() - A.loaded < 20000) return;
  let out = [];
  for (let p = 0; p < 10; p++) {
    const res = await databases.listDocuments(DB, CONFIG.actionsId, [Query.orderDesc('$createdAt'), Query.limit(100), Query.offset(p * 100)]);
    out = out.concat(res.documents);
    if (res.documents.length < 100) break;
  }
  A.rows = out; A.loaded = Date.now(); indexActions();
}
function addRow(doc) { A.rows.unshift(doc); indexActions(); }
function removeRow(id) { A.rows = A.rows.filter(r => r.$id !== id); indexActions(); }
async function act(create, fn) {
  if (!user) { toast('اول وارد شو'); return false; }
  if (!actionsReady()) { toast('این بخش هنوز تنظیم نشده'); return false; }
  try { await fn(); return true; } catch (e) { toast(e.message || 'انجام نشد'); return false; }
}
const nameOf = (uid, fallback) => A.names.get(uid) || fallback || 'کاربر';
function avatar(uid, name, big) {
  const p = A.profiles.get(uid);
  if (p && p.avatar) return h('img', { class: 'avatar' + (big ? ' big' : ''), src: fileUrl(p.avatar), alt: '' });
  return h('span', { class: 'avatar' + (big ? ' big' : '') }, (name || '؟').trim().charAt(0).toUpperCase());
}

// ---------- لایک، ذخیره، فالو، بلاک، ریپورت ----------
async function toggleLike(d) {
  const set = A.likes.get(d.$id) || new Set();
  await act(0, async () => {
    const id = await hid('l', user.$id + d.$id);
    if (set.has(user.$id)) { await databases.deleteDocument(DB, CONFIG.actionsId, id); removeRow(id); }
    else addRow(await databases.createDocument(DB, CONFIG.actionsId, id, { kind: 'like', userId: user.$id, userName: me(), targetId: d.$id }, pubPerms()));
  });
}
async function toggleFollow(uid) {
  const set = A.following.get(user ? user.$id : '') || new Set();
  return act(0, async () => {
    const id = await hid('f', user.$id + uid);
    if (set.has(uid)) { await databases.deleteDocument(DB, CONFIG.actionsId, id); removeRow(id); }
    else addRow(await databases.createDocument(DB, CONFIG.actionsId, id, { kind: 'follow', userId: user.$id, userName: me(), targetId: uid }, pubPerms()));
  });
}
async function toggleBlock(uid) {
  return act(0, async () => {
    const id = await hid('b', user.$id + uid);
    if (A.blocked.has(uid)) { await databases.deleteDocument(DB, CONFIG.actionsId, id); removeRow(id); }
    else {
      if (!confirm('این کاربر بلاک بشه؟ پست‌هاش رو نمی‌بینی.')) return;
      addRow(await databases.createDocument(DB, CONFIG.actionsId, id, { kind: 'block', userId: user.$id, targetId: uid }, privPerms()));
    }
  });
}
async function savePost(d) {
  const mine = A.mySaves.filter(r => r.targetId === d.$id);
  await act(0, async () => {
    if (mine.length) {
      if (!confirm('از لیست‌های ذخیره حذف بشه؟')) return;
      for (const r of mine) { await databases.deleteDocument(DB, CONFIG.actionsId, r.$id); removeRow(r.$id); }
    } else {
      const list = (prompt('اسم لیست (خالی بذاری می‌ره تو «save»)', 'save') || '').trim() || 'save';
      const id = await hid('s', user.$id + d.$id + list);
      addRow(await databases.createDocument(DB, CONFIG.actionsId, id, { kind: 'save', userId: user.$id, targetId: d.$id, text: list.slice(0, 60) }, privPerms()));
    }
  });
}
async function reportPost(d) {
  const reason = prompt('دلیل گزارش چیه؟');
  if (!reason || !reason.trim()) return;
  const ok = await act(0, async () => {
    await databases.createDocument(DB, CONFIG.actionsId, ID.unique(),
      { kind: 'report', userId: user.$id, userName: me(), targetId: d.$id, text: (reason.trim() + ' | نویسنده: ' + d.userId).slice(0, 1000) }, privPerms());
  });
  if (ok) toast('گزارش ثبت شد');
}
async function addComment(d, text, parentId) {
  return act(0, async () => {
    const data = { kind: 'comment', userId: user.$id, userName: me(), targetId: d.$id, text: text.slice(0, 1000) };
    if (parentId) data.parentId = parentId;
    addRow(await databases.createDocument(DB, CONFIG.actionsId, ID.unique(), data, pubPerms()));
  });
}
async function deleteComment(c) {
  if (!confirm('کامنت حذف بشه؟')) return false;
  return act(0, async () => {
    await databases.deleteDocument(DB, CONFIG.actionsId, c.$id); removeRow(c.$id);
    for (const r of A.rows.filter(r => r.parentId === c.$id)) { try { await databases.deleteDocument(DB, CONFIG.actionsId, r.$id); } catch {} removeRow(r.$id); }
  });
}

// ---------- پست‌ها ----------
let allPosts = [], loadedAt = 0;
async function fetchPosts(force) {
  if (!force && allPosts.length && Date.now() - loadedAt < 30000) return allPosts;
  const since = new Date(Date.now() - KEEP_MS).toISOString();
  let out = [];
  for (let p = 0; p < 5; p++) {
    const res = await databases.listDocuments(DB, POSTS, [Query.greaterThan('$createdAt', since), Query.orderDesc('$createdAt'), Query.limit(100), Query.offset(p * 100)]);
    out = out.concat(res.documents);
    if (res.documents.length < 100) break;
  }
  allPosts = out; loadedAt = Date.now();
  return out;
}
const visible = list => list.filter(p => !A.blocked.has(p.userId));
function rank(list) {
  const total = Object.values(prefs.types).reduce((a, b) => a + b, 0) || 1;
  const now = Date.now();
  return list.map(d => {
    const age = Math.min(1, (now - new Date(d.$createdAt)) / KEEP_MS);
    const typeW = (prefs.types[d.type] || 0) / total * 3;
    const authW = Math.min(prefs.authors[d.userId] || 0, 10) / 10 * 3;
    const likeW = Math.min((A.likes.get(d.$id) || new Set()).size, 10) / 10;
    const mine = own(d.userId) ? -1.5 : 0;
    return { d, s: typeW + authW + likeW + 2 * (1 - age) + Math.random() * 0.8 + mine };
  }).sort((a, b) => b.s - a.s).map(x => x.d);
}
const seen = new Set();
function record(id, type, uid, w) {
  if (!user) return;
  if (w === 1) { if (seen.has(id)) return; seen.add(id); }
  prefs.types[type] = (prefs.types[type] || 0) + w;
  if (uid !== user.$id) prefs.authors[uid] = (prefs.authors[uid] || 0) + w;
  savePrefs();
}
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    const el = e.target;
    if (e.isIntersecting) el._t = setTimeout(() => record(el.dataset.id, el.dataset.type, el.dataset.uid, 1), 1500);
    else clearTimeout(el._t);
  }
}, { threshold: 0.6 });

function card(d) {
  const el = h('article', { class: 'card' });
  el.dataset.id = d.$id; el.dataset.type = d.type; el.dataset.uid = d.userId;
  const nm = nameOf(d.userId, d.userName);
  const head = h('div', { class: 'head' }, h('a', { class: 'who', href: '#/u/' + d.userId }, avatar(d.userId, nm), nm));
  if (own(d.userId)) {
    const tools = h('div', { class: 'row' });
    if ((d.$permissions || []).some(p => p.startsWith('update('))) {
      tools.append(h('button', { class: 'ghost small', onclick: () => editPost(d) }, 'ویرایش'));
    }
    tools.append(h('button', { class: 'danger', onclick: () => removePost(d) }, 'حذف'));
    head.append(tools);
  }
  el.append(head);
  if (d.type === 'video' && d.fileId && d.fileId !== 'none') {
    const v = h('video', { controls: '', preload: 'metadata', src: fileUrl(d.fileId) });
    let played = false;
    v.onplay = () => { if (!played) { played = true; record(d.$id, 'video', d.userId, 2); } };
    el.append(v);
  } else if (d.type === 'image' && d.fileId && d.fileId !== 'none') {
    el.append(h('img', { class: 'media', src: fileUrl(d.fileId), loading: 'lazy', alt: '' }));
  }
  if (d.text) el.append(h('p', { class: d.type === 'text' ? 'only' : '' }, d.text));
  el.append(h('div', { class: 'time' }, timeAgo(d.$createdAt)));

  const bar = h('div', { class: 'bar' });
  const cbox = h('div', { class: 'cbox', style: 'display:none' });
  let replyTo = null;
  const drawBar = () => {
    const likes = A.likes.get(d.$id) || new Set();
    const liked = user && likes.has(user.$id);
    const saved = user && A.mySaves.some(r => r.targetId === d.$id);
    bar.innerHTML = '';
    bar.append(
      h('button', { class: 'act' + (liked ? ' on' : ''), onclick: async () => { await toggleLike(d); drawBar(); } }, (liked ? '♥ ' : '♡ ') + likes.size),
      h('button', { class: 'act', onclick: () => { cbox.style.display = cbox.style.display === 'none' ? '' : 'none'; drawComments(); } }, '💬 ' + (A.comments.get(d.$id) || []).length),
      h('button', { class: 'act', onclick: async () => { await savePost(d); drawBar(); } }, saved ? '🔖 ذخیره شده' : '🔖 ذخیره'),
      h('button', { class: 'act', onclick: () => reportPost(d), 'aria-label': 'گزارش' }, '⚑'));
  };
  const drawComments = () => {
    if (cbox.style.display === 'none') return;
    cbox.innerHTML = '';
    const all = A.comments.get(d.$id) || [];
    const tops = all.filter(c => !c.parentId);
    const line = (c, rep) => h('div', { class: 'cm' + (rep ? ' rep' : '') },
      h('div', { class: 'meta' }, h('a', { href: '#/u/' + c.userId }, nameOf(c.userId, c.userName)), ' · ' + timeAgo(c.$createdAt)),
      h('div', { class: 't' }, c.text),
      h('div', { class: 'row' },

// ---------- پست جدید ----------
function compressImage(file, maxW, q) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(new File([b], 'photo.jpg', { type: 'image/jpeg' })) : reject('فشرده‌سازی عکس انجام نشد'), 'image/jpeg', q);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject('این عکس باز نشد');
    img.src = URL.createObjectURL(file);
  });
}
function videoDuration(file) {
  return new Promise((resolve, reject) => {
    const v = document.createElement('video'); v.preload = 'metadata';
    v.onloadedmetadata = () => { URL.revokeObjectURL(v.src); resolve(v.duration); };
    v.onerror = () => reject('این ویدیو باز نشد');
    v.src = URL.createObjectURL(file);
  });
}

          e.preventDefault();

          try { await databases.deleteDocument(DB, MSG, m.$id); lastKey = null; load(); } catch (er) { toast(er.message || 'حذف نشد'); }
        } }, 'حذف')))));
    window.scrollTo(0, document.body.scrollHeight);
  };
  const load = async () => {
    try {
      fetchActions(false).catch(() => {});
      const res = await databases.listDocuments(DB, MSG, [Query.orderDesc('$createdAt'), Query.limit(50)]);
      draw(res.documents.slice().reverse());
    } catch (e) { lastKey = null; box.innerHTML = '<div class="empty">پیام‌ها بارگذاری نشد: ' + (e.message || '') + '</div>'; }
  };

  chatTimer = setInterval(load, 5000);
}

  if (user && !user.name && actionsReady()) { navEl.style.display = 'none'; viewChooseName(); return; }
  navEl.style.display = '';
  const parts = (location.hash || '#/posts').split('/');
  const page = parts[1] || 'posts', arg = parts[2];
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.p === page));
  if (page !== 'chat') window.scrollTo(0, 0);
  if (page === 'chat') viewChat();
  else if (page === 'search') viewSearch();
  else if (page === 'u' && arg) viewProfile(arg);
  else if (page === 'me') { if (!user) location.hash = '#/login'; else viewProfile(user.$id); }
  else if (page === 'new') viewNew();
  else if (page === 'login') viewLogin();
  else viewPosts();
}
window.addEventListener('hashchange', route);
(async () => {
  const qs = new URLSearchParams(location.search);
  if (qs.get('userId') && qs.get('secret')) {
    try { await account.updateVerification(qs.get('userId'), qs.get('secret')); toast('ایمیلت تأیید شد'); }
    catch (e) { toast('لینک تأیید معتبر نیست یا باید تو همون مرورگری که واردش شدی بازش کنی'); }
    history.replaceState(null, '', location.pathname + (location.hash || ''));
  }
  await checkUser();
  if (user && user.name && actionsReady()) { claimName(user.name).catch(() => {}); }
  route();
})();
</script>
